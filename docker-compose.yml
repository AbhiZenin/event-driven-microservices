services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d commerce"
        ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s


  redis:
    image: redis:7-alpine

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 3s
      timeout: 3s
      retries: 10


  redpanda:
    image: redpandadata/redpanda:v24.2.18

    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - redpanda:9092

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk cluster health --exit-when-healthy >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s



  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: gateway

    environment:
      SERVICE: gateway
      PORT: "8080"

      ORDERS_SERVICE_URL: http://orders:8001

      REDIS_URL: redis://redis:6379/0

      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRE_MINUTES: "60"

      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}

      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-60}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"

      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces

    depends_on:
      redis:
        condition: service_healthy

      orders:
        condition: service_started

    restart: unless-stopped

    ports:
      - "8088:8080"

  orders:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: orders

    environment:
      SERVICE: orders
      PORT: "8001"

      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/commerce

      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      REDIS_URL: redis://redis:6379/0

      MAX_EVENT_RETRIES: "3"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      redpanda:
        condition: service_healthy

    restart: unless-stopped

    ports:
      - "8001:8001"


  payments:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: payments

    environment:
      SERVICE: payments
      PORT: "8002"

      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      REDIS_URL: redis://redis:6379/0

      MAX_EVENT_RETRIES: "3"

    depends_on:
      redis:
        condition: service_healthy

      redpanda:
        condition: service_healthy

    restart: unless-stopped

    ports:
      - "8002:8002"


  inventory:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: inventory

    environment:
      SERVICE: inventory
      PORT: "8003"

      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      REDIS_URL: redis://redis:6379/0

      MAX_EVENT_RETRIES: "3"

    depends_on:
      redis:
        condition: service_healthy

      redpanda:
        condition: service_healthy

    restart: unless-stopped

    ports:
      - "8003:8003"


  notifications:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: notifications

    environment:
      SERVICE: notifications
      PORT: "8004"

      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      REDIS_URL: redis://redis:6379/0

      MAX_EVENT_RETRIES: "3"

    depends_on:
      redis:
        condition: service_healthy

      redpanda:
        condition: service_healthy

    restart: unless-stopped

    ports:
      - "8004:8004"




  tempo:
    image: grafana/tempo:2.6.1

    command:
      - "-config.file=/etc/tempo.yml"

    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.5.0

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - orders
      - payments
      - inventory
      - notifications

    ports:
      - "9095:9090"

    restart: unless-stopped


  grafana:
    image: grafana/grafana:12.1.1

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    ports:
      - "3005:3000"

    restart: unless-stopped

volumes:

  postgres_data:

  redis_data:

  redpanda_data:

  grafana_data:

  tempo_data:
