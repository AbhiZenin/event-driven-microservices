global:
  scrape_interval: 5s

scrape_configs:

  - job_name: gateway
    static_configs:
      - targets:
          - gateway:8080

  - job_name: orders
    static_configs:
      - targets:
          - orders:8001

  - job_name: payments
    static_configs:
      - targets:
          - payments:8002

  - job_name: inventory
    static_configs:
      - targets:
          - inventory:8003

  - job_name: notifications
    static_configs:
      - targets:
          - notifications:8004
