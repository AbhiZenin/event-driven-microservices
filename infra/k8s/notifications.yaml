apiVersion: apps/v1
kind: Deployment
metadata: { name: notifications }
spec:
  replicas: 1
  selector: { matchLabels: { app: notifications } }
  template:
    metadata: { labels: { app: notifications } }
    spec:
      containers:
        - name: notifications
          image: your-dockerhub/notifications:latest
          env:
            - { name: SERVICE, value: notifications }
            - { name: PORT, value: "8004" }
