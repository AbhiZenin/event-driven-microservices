apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory }
spec:
  replicas: 2
  selector: { matchLabels: { app: inventory } }
  template:
    metadata: { labels: { app: inventory } }
    spec:
      containers:
        - name: inventory
          image: your-dockerhub/inventory:latest
          env:
            - { name: SERVICE, value: inventory }
            - { name: PORT, value: "8003" }
