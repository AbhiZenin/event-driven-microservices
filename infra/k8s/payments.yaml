apiVersion: apps/v1
kind: Deployment
metadata: { name: payments }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: payments
          image: your-dockerhub/payments:latest
          env:
            - { name: SERVICE, value: payments }
            - { name: PORT, value: "8002" }
