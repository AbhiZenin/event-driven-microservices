name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall -q services

      - name: Run unit tests
        run: |
          python -m pytest -v tests/test_events.py


  kubernetes-validation:
    name: Validate Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate manifests with kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >
            -strict
            -summary
            /github/workspace/infra/k8s


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - kubernetes-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start integration environment
        env:
          RATE_LIMIT_REQUESTS: "10000"
        run: |
          docker compose up -d --build \
            db \
            redis \
            redpanda \
            tempo \
            orders \
            payments \
            inventory \
            notifications \
            gateway

      - name: Wait for gateway
        run: |
          echo "Waiting for gateway..."

          for attempt in {1..60}; do
            if curl --fail --silent \
              http://localhost:8088/health > /dev/null; then

              echo "Gateway is healthy."
              exit 0
            fi

            echo "Attempt $attempt/60"
            sleep 2
          done

          echo "Gateway failed to become healthy."

          docker compose ps
          docker compose logs \
            gateway \
            orders \
            inventory \
            payments \
            notifications \
            --tail=200

          exit 1

      - name: Run integration tests
        env:
          GATEWAY_URL: http://localhost:8088
        run: |
          python -m pytest -v tests/integration

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps

          docker compose logs \
            gateway \
            orders \
            inventory \
            payments \
            notifications \
            --tail=300

      - name: Stop integration environment
        if: always()
        run: |
          docker compose down -v


  publish-images:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - integration-tests

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false

      matrix:
        service:
          - gateway
          - orders
          - inventory
          - payments
          - notifications

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true

          tags: |
            ghcr.io/abhizenin/event-driven-microservices-${{ matrix.service }}:latest
            ghcr.io/abhizenin/event-driven-microservices-${{ matrix.service }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
